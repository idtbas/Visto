<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visto – ein Gehirn lernt laufen</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <span class="logo">◍</span>
          <h1>Visto</h1>
          <span class="tagline">ein simuliertes Gehirn lernt laufen</span>
        </div>
        <div class="clock">
          <span id="simTime">0:00</span>
          <span class="dim" id="simSpeed">×1.0</span>
        </div>
        <div class="controls">
          <button id="btnPause" title="Pause / Weiter">❚❚</button>
          <div class="seg" id="speedSeg">
            <button data-speed="0.25">¼×</button>
            <button data-speed="1" class="on">1×</button>
            <button data-speed="4">4×</button>
            <button data-speed="0">max</button>
          </div>
          <div class="seg" id="goSeg">
            <button data-go="1" class="on" title="Mit Starthilfe loslaufen">Laufen</button>
            <button data-go="0" title="Ruhig stehen bleiben">Stehen</button>
          </div>
          <button id="btnReset" title="Wieder aufstellen">Aufstellen</button>
          <button id="btnNewLife" title="Gehirn zurücksetzen und von vorn beginnen">Neues Leben</button>
          <span class="dim" id="saveNote"></span>
        </div>
      </header>
      <main>
        <div class="col left">
          <section class="world">
            <canvas id="world"></canvas>
            <div class="hud" id="hud"></div>
            <div class="state" id="lifeState"></div>
          </section>
          <section class="learn">
            <div class="learnChart">
              <h2>Lernkurve <span class="meta">Strecke pro Versuch · orange = Schnitt der letzten 15</span></h2>
              <div class="learnWrap"><canvas id="learn"></canvas></div>
            </div>
            <div class="toneBox">
              <h2>Tonus-Kerne <span class="meta">gelernt</span></h2>
              <div id="toneRows"></div>
              <div class="trow dec" title="Gelernte Entscheidung der Basalganglien: Wie stark löst ein Hindernis in 0,3 / 0,6 / 0,9 / 1,3 m Entfernung den Befehl „Füße anheben“ aus? Das Wesen wird unentschlossen geboren (halbe Balken).">
                <span>Füße heben?</span><span class="dbars" id="decBars"><i></i><i></i><i></i><i></i></span><span class="tv" id="decVal"></span>
              </div>
            </div>
          </section>
          <section class="strip" id="lifeStrip">
            <div class="stat cookieBox">
              <button id="btnCookie" title="Belohnung geben (Taste C)">🍪 Cookie geben</button>
              <label class="toggle" title="Belohnt Fortschritt automatisch und legt Cookies auf den Weg"><input type="checkbox" id="chkAuto" checked /> Auto-Belohnung</label>
              <label class="toggle" title="Legt kleine Stufen in den Weg. Hinter jeder wartet ein Cookie."><input type="checkbox" id="chkObst" /> Hindernisse</label>
            </div>
            <div class="stat"><span class="k">Energie</span><span class="v"><span class="ebar"><span id="energyFill"></span></span></span></div>
            <div class="stat"><span class="k">Cookies</span><span class="v" id="stCookies">0</span></div>
            <div class="stat"><span class="k">Stürze</span><span class="v" id="stFalls">0</span></div>
            <div class="stat"><span class="k">Versuch</span><span class="v" id="stAttempt">0,0 m</span></div>
            <div class="stat"><span class="k">Rekord</span><span class="v" id="stBest">0,0 m</span></div>
          </section>
        </div>
        <div class="col right">
          <section class="panel brain">
            <h2>Nervensystem <span class="meta" id="brainMeta"></span>
              <label class="toggle inl" title="Baut zusätzlich ein Kleinhirn mit 12.000 Körnerzellen ein. Experimentell: Es lernt, verbessert das Laufen aber noch nicht messbar und macht die Simulation langsamer. Das Gehirn wird dafür neu aufgebaut."><input type="checkbox" id="chkCb" /> Kleinhirn (experimentell)</label>
            </h2>
            <div class="brainWrap">
              <canvas id="brain"></canvas>
              <div class="tip" id="brainTip"></div>
            </div>
          </section>
          <div class="lower">
            <section class="panel" id="hormonePanel">
              <h2>Botenstoffe <span class="meta">letzte Minute</span></h2>
              <div id="hormoneRows"></div>
            </section>
            <section class="panel" id="musclePanel">
              <h2>Muskeln <span class="meta" id="muscleHint"></span></h2>
              <div id="muscleRows"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
